spring:
  application:
    name: solution
  datasource:
    url: jdbc:mysql://localhost:3306/solution?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
    username: root
    password: 123456
    driver-class-name: com.mysql.cj.jdbc.Driver
  sql:
    init:
      mode: always
      encoding: UTF-8
  servlet:
    multipart:
      max-file-size: 30MB
      max-request-size: 100MB

solution:
  agent:
    model: dashscope:qwen3.6-plus
    workspace: .agentscope/workspace
    timeout: PT3M
    execution-threads: 2
    lease-duration: PT5M
    max-retries: 3
    retry-delay: PT5S
  sse:
    heartbeat-millis: 15000
server:
  port: 9090
