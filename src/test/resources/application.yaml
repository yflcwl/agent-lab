spring:
  datasource:
    url: jdbc:h2:mem:solution;MODE=MySQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  sql:
    init:
      mode: always
      encoding: UTF-8

solution:
  agent:
    enabled: false
    execution-threads: 1
    lease-duration: PT2S
  sse:
    heartbeat-millis: 60000
